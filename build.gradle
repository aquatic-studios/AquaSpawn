plugins {
    id 'java'
    id 'com.gradleup.shadow' version '8.3.5'
}

group = 'com.aquaticstudios'
version = '1.0.0'

repositories {
    mavenCentral()
    maven {
        name = "papermc"
        url = "https://repo.papermc.io/repository/maven-public/"
    }
    maven {
        name = "placeholderapi"
        url = "https://repo.extendedclip.com/content/repositories/placeholderapi/"
    }
    maven {
        name = "jitpack"
        url = "https://jitpack.io"
    }
}

dependencies {
    compileOnly "com.destroystokyo.paper:paper-api:1.16.5-R0.1-SNAPSHOT"
    compileOnly "me.clip:placeholderapi:2.12.2"

    implementation "com.github.senkex:HeadRender:4.0.0"
    implementation "com.github.senkex:CenterMessage:4.0.0"

    // Adventure: components, MiniMessage and cross-version audiences (bossbar, title,
    // actionbar, chat). Paper 1.16.5 only bundles an old adventure without MiniMessage,
    // so we shade a modern stack and send through BukkitAudiences.
    implementation "net.kyori:adventure-platform-bukkit:4.3.4"
    implementation "net.kyori:adventure-text-minimessage:4.17.0"

    // self-updating YAML config with versioning.
    implementation "dev.dejvokep:boosted-yaml:1.3.1"
}

def targetJavaVersion = 17
java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    sourceCompatibility = javaVersion
    targetCompatibility = javaVersion
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release.set(targetJavaVersion)
}

processResources {
    def props = [version: version]
    inputs.properties props
    filteringCharset 'UTF-8'
    filesMatching('plugin.yml') {
        expand props
    }
}

shadowJar {
    archiveClassifier.set('')

    relocate 'com.github.senkex.headrender', 'com.aquaticstudios.aquaspawn.libs.headrender'
    relocate 'com.github.senkex.centermessage', 'com.aquaticstudios.aquaspawn.libs.centermessage'
    relocate 'net.kyori', 'com.aquaticstudios.aquaspawn.libs.kyori'
    relocate 'dev.dejvokep.boostedyaml', 'com.aquaticstudios.aquaspawn.libs.boostedyaml'

    // MiniMessage and the adventure platform load providers through ServiceLoader; keep
    // and relocate their service files. minimize() is intentionally left off because it
    // strips these reflectively-loaded providers.
    mergeServiceFiles()
}

tasks.named('build') {
    dependsOn tasks.named('shadowJar')
}

jar {
    enabled = false
}
