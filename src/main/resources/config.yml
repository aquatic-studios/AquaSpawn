settings:
  # spawn players land on when joining, made with /aquaspawn create <name>, "none" = never teleport
  join-spawn: "none"

  # first = only their first join ever, force = every join, custom = use the block below
  type-spawn: force # first, force, custom

  # only read when type-spawn is custom, a spawn name per case or "none" to skip
  custom:
    first: "none"
    force: "none"

  # replaces the vanilla "joined" line (always hidden), %player% = joining player, one entry per line
  join-message:
    enabled: true
    text:
      - "&#6AB7FF[+] &f%player% &#6AB7FFjoin the game"

  # replaces the vanilla "left" line (always hidden)
  quit-message:
    enabled: true
    text:
      - "&#FF3131[-] &f%player% &#FF3131left the game"

spawn:
  # require a permission to use /spawn, false = anyone can use it
  require-permission: false
  # permission checked when require-permission is true (aquaspawn.admin always works)
  permission: "aquaspawn.spawn"
  # seconds between /spawn uses, 0 disables, bypass with aquaspawn.spawn.bypass
  cooldown: 3

# cache the head skin on join so <hd> welcomes show instantly instead of waiting on a download
preload-skins: true

# tell console and admins (aquaspawn.update) when a newer version is on spigot
update-notify: true

# shown/run on join, every channel toggles on its own
# placeholders: %aquaspawn_total_players% (unique players ever, = this player's number on first join) + any PlaceholderAPI
# text tags: <center>text</center> center a line | <hd> one head row (use 8 for a full head) | <head>name</head> inline head
custom-events:
  # master switch for join, first-join and actions
  enabled: true

  # ticks to wait before titles/action bars/boss bars (dropped if sent too early), raise if they don't show
  delay-ticks: 20

  # shown on EVERY join
  join:
    enabled: true

    # chat lines, "<empty>" = blank line
    chat:
      enabled: true
      message:
        - "<empty>"
        - "<center>&fWelcome back &#54ADF4%player_name%</center>"
        - "<empty>"

    # text above the hotbar, stay = seconds
    actionbar:
      enabled: true
      text: "&#54ADF4Welcome back, %player_name%!"
      stay: 3

    # centered title/subtitle, timings in ticks (20 = 1s)
    title:
      enabled: true
      fade-in: 10
      stay: 40
      fade-out: 10
      title: "&#54ADF4Welcome"
      subtitle: "&f%player_name%"

    # bar at the top, progress 0.0-1.0, stay in seconds (0 = whole session)
    bossbar:
      enabled: true
      text: "&aWelcome to the server"
      color: BLUE # PINK, BLUE, RED, GREEN, YELLOW, PURPLE, WHITE
      overlay: PROGRESS # PROGRESS, NOTCHED_6, NOTCHED_10, NOTCHED_12, NOTCHED_20
      progress: 1.0
      stay: 5

    # SOUND:volume:pitch, volume and pitch optional
    sound:
      enabled: true
      value: "BLOCK_NOTE_BLOCK_PLING:1:1"

    # power = flight height, colors/fade-colors are hex
    firework:
      enabled: true
      power: 1
      type: BALL # BALL, BALL_LARGE, STAR, BURST, CREEPER
      colors:
        - "#54ADF4"
      fade-colors:
        - "#FFFFFF"
      flicker: false
      trail: true

    # %player% = joining player
    # [PLAYER] cmd | [CONSOLE] cmd | [EFFECT] TYPE:amplifier[:seconds]
    actions:
      - "[EFFECT] SPEED:0:30"

  # shown ONLY on a player's very first join ever, tracked forever
  first-join:
    enabled: true

    # true = show only this and skip the join block, false = run both on first join
    override: true

    chat:
      enabled: true
      message:
        - "<empty>"
        - "<hd>"
        - "<hd> &#54ADF4&lWELCOME"
        - "<hd>"
        - "<hd> &fWelcome &#54ADF4%player_name% &fto the server"
        - "<hd> &7You are player &#54ADF4#%aquaspawn_total_players%"
        - "<hd>"
        - "<hd> &fYou playing in &#6AB7FFplay.yourserver.net"
        - "<hd>"
        - "<empty>"

    actionbar:
      enabled: true
      text: "&#8DFF87Welcome to the server!"
      stay: 4

    title:
      enabled: true
      fade-in: 10
      stay: 60
      fade-out: 10
      title: "&#54ADF4&lWelcome"
      subtitle: "&fYou are player &#8DFF87#%aquaspawn_total_players%"

    bossbar:
      enabled: true
      text: "&aEnjoy your stay!"
      color: GREEN
      overlay: PROGRESS
      progress: 1.0
      stay: 6

    firework:
      enabled: true
      power: 1
      type: BALL_LARGE
      colors:
        - "#54ADF4"
        - "#8DFF87"
      fade-colors:
        - "#FFFFFF"
      flicker: true
      trail: true

    sound:
      enabled: true
      value: "ENTITY_PLAYER_LEVELUP:1:1"

    # same action types as join.actions
    actions:
      - "[CONSOLE] give %player% diamond 1"
      - "[PLAYER] kit claim default"
      - "[EFFECT] SPEED:2"

# Do not change this
version: 1
