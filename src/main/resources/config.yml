settings:
  # the spawn players are teleported to. it must be a spawn you created
  # with /aquaspawn create <name>. set it to "none" to disable teleporting.
  join-spawn: "none"

  # how players are teleported to the spawn on join:
  #   first  -> only the very first time they ever join
  #   force  -> every single time they join
  #   custom -> use the "custom" section below (fully configurable)
  type-spawn: force

  # only used when type-spawn is set to "custom".
  #   first -> spawn used the very first time a player joins
  #   force -> spawn used on every join after the first one
  # each field takes a created spawn name, or "none" / "null" / "false"
  # to disable that side so the player is not teleported.
  # example: first: "welcome"  force: "hub"
  #   -> first join sends them to "welcome", every later join to "hub".
  custom:
    first: "none"
    force: "none"

  # if true, the vanilla "player joined the game" message is hidden
  hide-join-message: false
  # if true, the vanilla "player left the game" message is hidden
  hide-quit-message: false

spawn:
  # cooldown in seconds between uses of /spawn.
  # note: leave it on 0 to disable the cooldown. players with the
  # permission aquaspawn.spawn.bypass are never affected by it.
  cooldown: 3

# everything shown/run when a player joins. every channel below is optional and
# fully editable (toggles, timings in ticks/seconds, sounds, colors).
#
# text syntax (works in every channel):
#   &a / &#54ADF4     -> legacy and hex colors
#   <gradient> <bold> -> full MiniMessage tags
#   %player_name%     -> PlaceholderAPI placeholders (if installed)
#   %aquaspawn_total_players%   -> unique players that ever joined (on first join
#                                  this is the new player's number too)
#   <center>...</center>        -> center the line
#   <hd>name</hd> / %head:name% -> render a player's head as pixel art (chat only)
join:
  # master switch for everything below.
  enabled: true

  # runs on EVERY join.
  join-motd:
    enabled: true
    chat:
      enabled: true
      message:
        - "<empty>"
        - "<center>&fWelcome back &#54ADF4%player_name%"
        - "<empty>"
    # action bar text; "stay" is how many seconds it stays visible.
    actionbar:
      enabled: false
      text: "&#54ADF4Welcome back, %player_name%!"
      stay: 3
    # timings in ticks (20 ticks = 1 second).
    title:
      enabled: false
      fade-in: 10
      stay: 40
      fade-out: 10
      title: "&#54ADF4Welcome"
      subtitle: "&f%player_name%"
    # color:   PINK / BLUE / RED / GREEN / YELLOW / PURPLE / WHITE
    # overlay: PROGRESS / NOTCHED_6 / NOTCHED_10 / NOTCHED_12 / NOTCHED_20
    # stay:    seconds the bar stays before it is removed.
    bossbar:
      enabled: false
      text: "&aWelcome to the server"
      color: BLUE
      overlay: PROGRESS
      progress: 1.0
      stay: 5
    # SOUND:volume:pitch
    sound:
      enabled: false
      value: "BLOCK_NOTE_BLOCK_PLING:1:1"

  # runs ONLY the very first time a player ever joins.
  first-join:
    enabled: true
    # true  -> first join shows ONLY this (join-motd is skipped for new players)
    # false -> both first-join and join-motd run on the first join
    override: true
    chat:
      enabled: true
      message:
        - "<empty>"
        - "<center><hd>%player_name%</hd></center>"
        - "<empty>"
        - "<center>&fWelcome &#54ADF4%player_name% &fto the server"
        - "<center>&7You are player &#54ADF4#%aquaspawn_total_players%"
        - "<empty>"
    actionbar:
      enabled: false
      text: "&#8DFF87Welcome to the server!"
      stay: 4
    title:
      enabled: true
      fade-in: 10
      stay: 60
      fade-out: 10
      title: "&#54ADF4&lWelcome"
      subtitle: "&fYou are player &#8DFF87#%aquaspawn_total_players%"
    bossbar:
      enabled: false
      text: "&aEnjoy your stay!"
      color: GREEN
      overlay: PROGRESS
      progress: 1.0
      stay: 6
    # type:   BALL / BALL_LARGE / STAR / BURST / CREEPER
    # colors and fade-colors take hex values.
    firework:
      enabled: true
      power: 1
      type: BALL_LARGE
      colors: [ "#54ADF4", "#8DFF87" ]
      fade-colors: [ "#FFFFFF" ]
      flicker: true
      trail: true
    sound:
      enabled: true
      value: "ENTITY_PLAYER_LEVELUP:1:1"

  # actions run when a player joins.
  #   [PLAYER]  <command>  -> the joining player runs the command
  #   [CONSOLE] <command>  -> the console runs the command
  #   [EFFECT]  TYPE:amplifier[:seconds]  -> potion effect (permanent if no seconds)
  # also available: [MESSAGE] [ACTIONBAR] [SOUND] S:vol:pitch [FIREWORK]
  actions:
    - "[CONSOLE] give %player% diamond 1"
    - "[PLAYER] kit claim"
    - "[EFFECT] SPEED:2"

version: 1
